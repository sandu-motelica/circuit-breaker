server:
  port: 8080

spring:
  http:
    clients:
      connect-timeout: 1s
      read-timeout: 3s

demo:
  client:
    upstream-base-url: http://localhost:8081
    sliding-window-size: 4
    minimum-calls: 4
    failure-rate-threshold: 0.5
    slow-call-rate-threshold: 0.5
    slow-call-duration-threshold: 1s
    duration-in-open-state: 5s
    permitted-calls-in-half-open: 2
